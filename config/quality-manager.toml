[coordinator]
database = "var/quality-manager.db"

[quality]
database = "../ada_quality/.ada-quality.db"
policy = "../ada_quality/quality-policy.toml"

[integrations]
ada_quality = "../ada_quality/bin/ada-quality"
improve = "../improve/bin/improve"
improve_config = "../improve/config/improve.toml"
improve_state = "var/improve.db"
model_runner = "../model_runner/bin/model_runner"

[scheduler]
assessment_workers = 4
agent_workers = 1
maximum_task_seconds = 3600
remediation_attempts = 2

[autonomy]
dry_run = false
