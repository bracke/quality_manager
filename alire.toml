name = "quality_manager"
description = "Durable autonomous quality coordination for Ada projects"
version = "0.1.0-dev"
licenses = "MIT"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
tags = ["quality", "automation", "ada", "coordination"]
project-files = ["quality_manager.gpr"]
executables = ["quality-manager"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
config = "*"

[[depends-on]]
jsonlib = "*"

[[depends-on]]
database = "*"

[[depends-on]]
hostkit = "*"

[[depends-on]]
cryptolib = "*"

[[pins]]
config = { url = "https://github.com/bracke/config.git", commit = "70325b0e27c8d10a6e95e387785125eea56cd86a" }

[[pins]]
jsonlib = { url = "https://github.com/bracke/jsonlib.git", commit = "24a1b18a7be19bb65725d8114c4f069658ced614" }

[[pins]]
database = { url = "https://github.com/bracke/database.git", commit = "389445ab12edf3206dadae902907bb1e92475673" }

[[pins]]
hostkit = { url = "https://github.com/bracke/hostkit.git", commit = "2fb21889d8518e7a609f1b5b61c95a5e7fb68d48" }

[[pins]]
representation = { url = "https://github.com/bracke/representation.git", commit = "23a5655b43679f4919d215b488c73a00eb79f8e3" }

[[pins]]
cryptolib = { url = "https://github.com/bracke/cryptolib.git", commit = "2e5c415f65fd49c2a496c97813740fa9b83e02fa" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr -n build && ./bin/quality_manager_tests"]

[build-profiles]
"*" = "development"
