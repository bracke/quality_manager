name = "quality_manager"
description = "Durable autonomous quality coordination for Ada projects"
version = "0.1.0-dev"
licenses = "MIT"
authors = ["Bent Bracke"]
maintainers = ["Bent Bracke <bent@bracke.dk>"]
maintainers-logins = ["bracke"]
tags = ["quality", "automation", "ada", "coordination"]
project-files = ["quality_manager.gpr"]
executables = ["quality-manager"]

[[depends-on]]
gnat_native = "=15.2.1"

[[depends-on]]
config = "*"

[[depends-on]]
jsonlib = "*"

[[depends-on]]
database = "*"

[[pins]]
config = { path = "../config" }

[[pins]]
jsonlib = { path = "../jsonlib" }

[[pins]]
database = { path = "../database" }

[[pins]]
representation = { path = "../representation" }

[[pins]]
cryptolib = { path = "../cryptolib" }

[[actions]]
type = "test"
command = ["sh", "-c", "cd tests && alr -n build && ./bin/quality_manager_tests"]

[build-profiles]
"*" = "development"
